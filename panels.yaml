# ─────────────────────────────────────────────────────────────────────────────
# Lonely Binary display panel table — THE single source of truth.
#
# Both language bindings are GENERATED from this file:
#     src/LB_Panels.h        (Arduino / C++)
#     micropython/lb_panels.py
#
# Never hand-edit those two. Run `python3 tools/gen_panels.py` after changing
# this file; CI fails the build if the generated files are stale.
#
# Adding a new panel = adding one entry here. No code changes.
#
# ─────────────────────────────────────────────────────────────────────────────
# NOTHING IN THIS FILE HAS BEEN MEASURED ON A KIT PANEL YET.
#
# Every value was inferred by reading the old per-panel sketches, and those two
# code paths do not even agree with each other. The clearest example is bgr on
# the ST7735 panels: the Arduino sketches let Arduino_GFX default to BGR, while
# the MicroPython scripts passed bgr=False, i.e. RGB. One of them has been
# wrong the whole time and nobody noticed, because the old test drew UNLABELLED
# colour bars — you cannot tell red from blue in a bar with no caption.
#
# So: verify each panel on a REAL KIT PANEL on the REAL BREAKOUT before
# treating any of this as settled, and annotate what you measured.
#
# Do NOT copy values out of internal/ bench runs. Those sketches deliberately
# drive non-standard panels on non-standard wiring to exercise the manual
# overrides (setColorOrder / setInverted / setBacklightActiveLow); what they
# report is a property of whatever is on the desk that day, not of the product.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
version: 1

# ── Wiring ───────────────────────────────────────────────────────────────────
# Every panel in the range uses the same 15-pin FPC and the same breakout, so
# the pins depend only on the MCU, never on the panel. Selected at compile time
# from CONFIG_IDF_TARGET_* (C++) / sys.implementation._machine (MicroPython).
wiring:
  esp32s3:
    cs: 10
    rst: 42
    dc: 2
    mosi: 11
    sclk: 12
    backlight: 41
    miso: -1
    spi_host: HSPI      # Arduino_GFX: SPI3 on the S3
    mp_spi_id: 1        # MicroPython: SPI(1) is the S3's FSPI on these native pins
    psram: true
    # I2C touch for the capacitive SPI panels (tap series). From the 1.28 inch
    # bench rig, 2026-10-29.
    touch_sda: 4
    touch_scl: 6
    touch_int: 5
    touch_rst: 7
  esp32:
    cs: 15
    rst: 4
    dc: 2
    mosi: 23
    sclk: 18
    backlight: 32
    miso: -1
    spi_host: VSPI      # Arduino_GFX: NOT FSPI — that is the on-chip flash bus
    mp_spi_id: 2        # MicroPython: SPI(2) is VSPI on its native pins
    psram: false
    # I2C touch for the capacitive SPI panels (tap series). Measured on the
    # 1.28 inch bench rig, 2026-10-29: IT7259 on SDA 27 / SCL 21, no INT or RST.
    touch_sda: 27
    touch_scl: 21
    touch_int: -1
    touch_rst: -1

# ── Parallel wiring (square series) ──────────────────────────────────────────
# The square panels are 8080 8-bit parallel with an I2C touch controller, on a
# breakout of their own. Same rule as above: the pins depend on the MCU, never
# on the panel.
#
# PROPOSED 2026-09-24 — the breakout is not built yet. Rules behind the choice:
#   * D0-D7, WR and DC all below GPIO 32. The bus writes one set/clear register
#     per byte; pins above 31 live in a second register and cost a second write.
#   * No boot-strapping pins on the data bus. The bench rig had D5 on GPIO12,
#     which picks the flash voltage at reset - moved to 26 here.
#   * Backlight and panel reset keep the roles they have on the SPI breakout
#     (ESP32: BL 32; S3: RST 42, BL 41).
#   * Touch on the MCU's usual I2C pins, so a customer's own I2C sensor can
#     share the bus through Wire.
# CS is tied low and RD tied high on the board: the bus has no other device.
wiring_par8:
  esp32s3:
    data: [4, 5, 6, 7, 15, 16, 17, 18]   # D0..D7, one run of the left header
    wr: 8
    dc: 9
    rst: 42
    backlight: 41
    touch_sda: 1
    touch_scl: 2
    touch_int: 40
    touch_rst: 39
  esp32:
    data: [5, 17, 16, 15, 13, 26, 14, 27]
    wr: 4
    dc: 23
    rst: 33
    backlight: 32
    touch_sda: 21
    touch_scl: 22
    touch_int: 18
    touch_rst: 19

# ── Panels ───────────────────────────────────────────────────────────────────
# product: true  = something Lonely Binary sells. These are the only entries a
#                  customer should ever have to look at; they pick by the size
#                  printed on the box and never see anything else.
# product: false = a panel we do not sell but can drive. Named by CONTROLLER
#                  and resolution rather than by size, so it cannot be mistaken
#                  for a product. This is the same two-namespace split
#                  LovyanGFX and Espressif's ESP32_Display_Panel use: product
#                  or board names on top, controller names underneath.
#
# const: overrides the generated constant name. Use it when the id has to stay
#        precise for device_info while the name in a sketch stays readable.
#
# offsets: [col1, row1, col2, row2]
#   Arduino_GFX takes two pairs: pair 1 applies at rotation 0/2, pair 2 at 1/3.
#   The MicroPython driver takes a single xstart/ystart — the generator picks
#   the pair matching the panel's default `rotation`.
#
# bgr / invert / flip_x / flip_y are panel facts. `invert` is the single
# inversion flag: Arduino_GFX spells the same thing `ips` in its constructors
# (that argument does nothing else), and the MicroPython driver calls it
# `invert`. Carrying both names meant one of them silently did nothing.
# NOTE: st77xx.ST77xx defaults
# to invert=True, and the original per-panel main.py scripts relied on that
# default rather than passing it — so "not mentioned in the old script" means
# true here, not false. Getting this wrong shows as inverted colours.
# Arduino_GFX bakes them into
# its per-driver init sequences, so the C++ side does not pass them; the
# MicroPython driver needs them explicitly. Recorded here either way so the two
# bindings cannot disagree.
#
# backlight_active_low: LOW turns the backlight ON. Every panel in the range
# dims — the library always drives the backlight with LEDC PWM, so
# backlight(0..255) behaves the same on all of them.

panels:
  # ── TFT-LCD series (rectangular, portrait) ─────────────────────────────────
  - id: tft_096
    product: true
    name: '0.96 inch'
    family: tft-lcd
    driver: ST7735
    width: 80
    height: 160
    rotation: 0
    offsets: [24, 0, 24, 0]
    bgr: true
    invert: false
    spi_hz: 20000000
    backlight_active_low: true   # the ONLY tft-lcd panel wired active-low
    notes: >-
      Arduino used gfx->begin() (SPI_DEFAULT_FREQ = 40 MHz on ESP32); MicroPython
      used 20 MHz. Taking the conservative value — verify on hardware.

  - id: tft_18
    product: true
    name: '1.8 inch'
    family: tft-lcd
    driver: ST7735
    width: 128
    height: 160
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false        # UNVERIFIED — see the warning at the top of this file
    invert: true
    flip_x: true
    flip_y: true
    spi_hz: 20000000
    backlight_active_low: false
    notes: >-
      Arduino used the 40 MHz default; MicroPython used 20 MHz. Conservative
      value taken — verify on hardware.

  - id: tft_20
    product: true
    name: '2.0 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight_active_low: false

  - id: tft_24
    product: true
    name: '2.4 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight_active_low: false

  - id: tft_28
    product: true
    name: '2.8 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight_active_low: false

  - id: tft_35
    product: true
    name: '3.5 inch'
    family: tft-lcd
    driver: ST7796
    width: 320
    height: 480
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: true
    invert: true
    spi_hz: 40000000
    backlight_active_low: false
    # VCOM (ST7796 VCMPCTL, C5) = 0.5 V + 0.025 V x n. The shared ST7796 table
    # sends 0x18 (1.1 V); at that, full-screen photos shimmer on mid tones like
    # an unsteady backlight. 0x05 (0.625 V) was clearly steadier on the 3.5 inch
    # glass, judged by eye on the FloppyDisk board (2026-11); re-check one with
    # examples/VcomTune. Optional per panel: without it the init table's value
    # stands.
    vcom: 0x05

  # ── Narrow LCD series (strip format, landscape, PWM backlight) ─────────────
  - id: narrow_114
    product: true
    name: '1.14 inch'
    family: narrow-lcd
    driver: ST7789
    width: 135
    height: 240
    rotation: 1
    offsets: [52, 40, 53, 40]
    bgr: false
    invert: true
    spi_hz: 8000000
    backlight_active_low: true
    notes: >-
      Arduino ran 8 MHz, MicroPython 20 MHz. Conservative value taken; if
      8 MHz holds on hardware at 20 MHz, raise it here once for both languages.

  - id: narrow_168
    product: true
    name: '1.68 inch'
    family: narrow-lcd
    driver: NV3007
    width: 142
    height: 428
    rotation: 1
    offsets: [12, 0, 14, 0]
    bgr: false
    invert: false
    spi_hz: 8000000
    backlight_active_low: true

  - id: narrow_19
    product: true
    name: '1.9 inch'
    family: narrow-lcd
    driver: ST7789
    width: 170
    height: 320
    rotation: 1
    offsets: [35, 0, 35, 0]
    bgr: false
    invert: true
    spi_hz: 8000000
    backlight_active_low: true
    notes: Arduino ran 8 MHz, MicroPython 20 MHz — verify on hardware.

  - id: narrow_225
    product: true
    name: '2.25 inch'
    family: narrow-lcd
    driver: ST7789
    width: 76
    height: 284
    rotation: 1
    offsets: [82, 18, 82, 18]
    bgr: false
    invert: false
    spi_hz: 8000000
    backlight_active_low: true
    notes: Arduino ran 8 MHz, MicroPython 20 MHz — verify on hardware.

  - id: narrow_279
    product: true
    name: '2.79 inch'
    family: narrow-lcd
    driver: NV3007
    width: 142
    height: 428
    rotation: 1
    offsets: [12, 0, 14, 0]
    bgr: false
    invert: false
    spi_hz: 20000000
    backlight_active_low: true
    init_ops: nv3007_279
    notes: >-
      Same NV3007 silicon as the 1.68 inch but a different voltage/gamma table.
      Without init_ops it would inherit the 1.68 inch settings and look wrong.

  # ── Square LCD series (8-bit parallel, touch) ──────────────────────────────
  #
  # bus: par8 selects wiring_par8 above. spi_hz does not apply.
  # touch: the controller and how its axes sit relative to rotation 0. The
  # controller's own resolution is read from the chip, so it is not here.
  # Suffix _ctp = capacitive touch, _rtp = resistive touch.

  - id: square_392_ctp
    product: true
    name: '3.92 inch square, capacitive touch'
    family: square-lcd
    driver: ILI9488
    bus: par8
    width: 320          # verified 2026-09-24
    height: 320         # verified 2026-09-24
    rotation: 0
    offsets: [0, 0, 0, 160]   # verified: glass faces controller RAM rows 0-319
    bgr: true           # verified 2026-09-24
    invert: true        # verified 2026-09-24
    backlight_active_low: false   # UNVERIFIED - the bench rig had no BL pin
    touch:
      controller: GT911
      swap_xy: false    # verified 2026-09-24, all four rotations 5/5
      flip_x: false
      flip_y: false
    notes: >-
      Active area 71.14 x 69.82 mm, so pixels are 0.222 x 0.218 mm: 1.9% taller
      than wide. Circles come out 2% oval, below what the eye notices. Colour,
      offsets, all four rotations and touch in all four rotations measured on
      the classic-ESP32 bench rig (bench wiring, not the proposed breakout).

  # ── Tap series (small round capacitive-touch panels, SPI) ──────────────────
  #
  # Watch-sized glass with capacitive touch over I2C. Ordinary SPI panels on the
  # standard breakout (`wiring`), plus the I2C touch pins from the same set.
  # Named by the diagonal in hundredths of an inch; _ctp = capacitive touch.

  - id: tap_128_ctp
    product: true
    name: '1.28 inch round, capacitive touch'
    family: tap
    driver: GC9A01
    width: 240
    height: 240
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: true           # MADCTL 0x08 at rotation 0, from the factory sketch
    invert: true        # the factory sketch passes ips=true; Arduino_GFX ends init with INVON
    spi_hz: 20000000    # the factory sketch ran 20 MHz
    backlight_active_low: false
    touch:
      controller: IT7259
      swap_xy: false    # the factory sketch uses the raw axes unflipped
      flip_x: false
      flip_y: false
    notes: >-
      Round 240 x 240 glass: the corners of the framebuffer are not visible.
      Values from the factory sketch (TK0128F25K, IT7259 touch demo); colour,
      inversion and touch orientation not yet re-measured through this library.
      The IT7259 reports 8-bit coordinates, 0-239, at I2C address 0x46.

  - id: tap_150_ctp
    product: true
    name: '1.5 inch, capacitive touch'
    family: tap
    driver: GC9306
    width: 240
    height: 320
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: true           # factory sketch MADCTL 0x48: BGR | MX
    invert: false       # factory sketch sends INVOFF
    spi_hz: 10000000    # the factory sketch's draw speed; it inits at 1 MHz on flying wires and says 40 MHz does not hold there
    backlight_active_low: false   # UNVERIFIED - the factory sketch never drives a backlight pin
    touch:
      controller: CST816
      swap_xy: false
      flip_x: false
      flip_y: false
      # The touch layer is bigger than the picture: the vendor's four-target
      # least-squares fit (disp_x = 0.8914 tx + 18.61, disp_y = 1.0636 ty + 29.28)
      # as raw values at the screen's edges: x at left/right, y at top/bottom.
      raw: [-21, 247, -28, 272]
    notes: >-
      Rounded-corner watch glass, 240 x 320 portrait. The datasheet file is named
      GC9306 but the commands are the ST7789's (COLMOD 0x55). From the factory
      sketch (FPC-1502401, CST816D at I2C 0x15); not yet re-run through this
      library. The factory wiring is the standard ESP32-S3 set: RES 42, CS 10,
      SCL 12, SDA 11, DC 2, touch SDA 4 / SCL 6 / RST 7 / INT 5.

  - id: tap_196_ctp
    product: true
    name: '1.96 inch, capacitive touch'
    family: tap
    driver: GC9307
    bus: par8
    width: 240
    height: 296         # the controller RAM is 240 x 320; the glass shows 296 rows
    rotation: 0
    offsets: [0, 0, 0, 24]   # rotation 0 verified on the factory sketch; the 24 for the two rotations that flip the row scan is a guess (320 - 296) - UNVERIFIED
    bgr: true           # MADCTL 0x08, factory sketch
    invert: false
    backlight_active_low: false   # no backlight pin: the LEDs are wired to 3.3 V through a resistor, always on
    par8:
      data: [5, 6, 4, 7, 15, 1, 10, 11]   # D0..D7 - NOT in order; the FPC numbers them D7..D0
      wr: 2
      dc: 42
      cs: 41
      rd: -1            # the panel has no RD pin
      rst: -1           # RES is tied to 3.3 V on the module: the driver sends a software reset
      backlight: -1
      touch_sda: 13
      touch_scl: 12     # TP_RES tied to 3.3 V and TP_INT not connected: polled, no reset pin
    touch:
      controller: CST816
      swap_xy: false    # UNVERIFIED - the factory sketch calibrates at every boot (5-point affine) instead of recording the result
      flip_x: false
      flip_y: false
      raw: [0, 239, 0, 295]   # UNVERIFIED - the chip's native range, assumed to match the glass
    notes: >-
      Factory sketch: RQ196BA24019, GC9307 + CST816D, 8080 8-bit parallel, on its
      own flying-wire pins (not the Tap breakout). The glass shows the picture
      mirrored left-right and any MADCTL with MX blanks it, so the driver mirrors
      in software (LB_TFT.cpp). The CST816D touch needs 4.7k pull-ups on SDA and
      SCL. Not yet run through this library.

  # ── RLCD series (reflective monochrome LCD, ST7305, SPI) ────────────────────
  #
  # Not e-paper: a frame goes out in a few milliseconds, nothing ghosts, there is
  # no backlight (ambient light is the light) and the picture is gone with the
  # power. The sketch draws in colour as on any panel; flush() thresholds to black
  # and white. Standard breakout pins (S3: CS 10, DC 2, MOSI 11, SCLK 12, RST 42).
  # The three OSPTEK glasses differ in voltages, RAM window and pixel packing:
  # init_ops picks the table in LB_ST7305.cpp. A set bit is black on these, so
  # invert is false (the Waveshare 400 x 300 below packs the other way).

  - id: rlcd_213
    product: true
    name: '2.13 inch reflective LCD'
    family: rlcd
    driver: ST7305
    width: 122
    height: 250
    rotation: 3         # ships landscape, 250 x 122 (rotation 1 shows it upside down on this glass)
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    spi_hz: 20000000    # the vendor sketch's rate; drop to 8-10 MHz on long jumper wires
    backlight_active_low: false
    init_ops: st7305_213
    notes: >-
      OSPTEK YDP213H001-V3, from the vendor's test sketch. 122 columns sit at RAM
      column 10 of 132. Not yet run through this library.

  - id: rlcd_290
    product: true
    name: '2.9 inch reflective LCD'
    family: rlcd
    driver: ST7305
    width: 168
    height: 384
    rotation: 1         # ships landscape, 384 x 168 (rotation 3 shows it upside down on this glass)
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    spi_hz: 20000000    # the vendor sketch's rate; drop to 8-10 MHz on long jumper wires
    backlight_active_low: false
    init_ops: st7305_290
    notes: >-
      OSPTEK YDP290H001/H004-V3, from the vendor's test sketch. 168 columns fill
      the RAM window with no offset. Not yet run through this library.

  - id: rlcd_420
    product: true
    name: '4.2 inch reflective LCD'
    family: rlcd
    driver: ST7305
    width: 400
    height: 300         # the glass is 300 x 400 natively; used landscape, as the vendor sketch does
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    spi_hz: 20000000    # the vendor sketch's rate; drop to 8-10 MHz on long jumper wires
    backlight_active_low: false
    init_ops: st7305_420
    notes: >-
      OSPTEK YDP420HT004-V3, from the vendor's test sketch (higher drive voltages than
      the Waveshare module below, which is the same glass size). Needs PSRAM for the
      240 KB canvas. Verified 2026-11-01 on an ESP32-S3 (N16R8 dev board) on the
      kit pins with RLCD_Check: pixel layout, orientation and polarity (black ink
      on a white page at invert false) all correct. Canvas in PSRAM; flush 18.5 ms
      (6.5 ms of it the 15 KB frame on the wire at 20 MHz, the rest packing);
      low-power mode 120 ms in / 320 ms out. A loose FPC shows as a blank panel
      with begin() still succeeding - the controller answers nothing over SPI.

  # ── RTP series (resistive touch, SPI) ──────────────────────────────────────
  #
  # Ordinary SPI TFT panels with a 4-wire resistive touch layer read by an NS2009
  # (a TSC2007-compatible controller) over I2C. Named by the diagonal in hundredths
  # of an inch. A resistive layer needs a firm press (a nail or stylus), and its
  # raw readings are not pixels: raw holds the reading at the screen's edges
  # (left, right, top, bottom). The values here are rough starting points; the
  # RtpCheck example runs a 5-point calibration and prints the real ones.

  - id: rtp_180
    product: true
    name: '1.8 inch, resistive touch'
    family: rtp
    driver: ST7735
    width: 128
    height: 160
    rotation: 1         # ships landscape, 160 x 128 (turned right 90 degrees)
    offsets: [2, 1, 2, 1]   # the 132 x 162 RAM, glass at column 2, row 1 (red-tab modules)
    bgr: false
    invert: true        # a TN panel; with bgr false, from the vendor's test sketch
    spi_hz: 20000000    # the vendor sketch ran 40 MHz after a 500 ms power-up wait; 20 here to be safe
    backlight_active_low: true    # LOW lights it
    touch:
      controller: NS2009
      swap_xy: true     # measured: this layer's raw X runs along the screen's Y
      flip_x: false
      flip_y: false
      raw: [3824, 217, 185, 3717]   # measured 2026-10-29 with the RtpCheck 4-point calibration (worst error 1 px)
    notes: >-
      From the vendor's ST7735_18_Touch_Test sketch. Wait about 500 ms after power-up
      before display.begin(), or the picture comes up scrambled. The touch chip is on
      I2C (SDA 4, SCL 6, IRQ 5, address 0x48-0x4B found automatically).

  - id: rtp_240
    product: true
    name: '2.4 inch, resistive touch'
    family: rtp
    driver: ST7789
    width: 240
    height: 320
    rotation: 1         # ships landscape, 320 x 240 (turned right 90 degrees)
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false       # NOT inverted: with true, red comes out cyan (vendor sketch, LCD_IPS false)
    spi_hz: 40000000
    backlight_active_low: true    # LOW lights it
    touch:
      controller: NS2009
      swap_xy: false
      flip_x: false
      flip_y: false
      raw: [189, 3796, 169, 3720]   # measured 2026-10-29 with the RtpCheck 4-point calibration (worst error 2 px)
    notes: >-
      Module YT240L030, from the vendor's 2_4 sketch. Its CS pin is not wired to the
      processor there (tied low), which the standard breakout's CS 10 does not
      disturb. The touch chip is judged by pressure alone: PENIRQ is not routed on
      this module.

  - id: rtp_280
    product: true
    name: '2.8 inch, resistive touch'
    family: rtp
    driver: ST7789
    width: 240
    height: 320
    rotation: 1         # ships landscape, 320 x 240, as the 1.8 and 2.4 do
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false       # NOT inverted: with true, red comes out cyan (vendor sketch, LCD_IPS false)
    spi_hz: 40000000
    backlight_active_low: true    # LOW lights it
    touch:
      controller: NS2009
      swap_xy: false
      flip_x: false
      flip_y: false
      raw: [321, 3786, 163, 3284]   # measured 2026-10-29 with the RtpCheck 4-point calibration
    notes: >-
      From the vendor's 2_8 sketch, which is the 2.4 inch one with the label changed:
      the same ST7789 settings, wiring and NS2009 touch. CS is wired here (GPIO 10).
      The touch chip is judged by pressure alone: PENIRQ is not routed on these modules.

  - id: rtp_430
    product: true
    name: '4.3 inch, resistive touch'
    family: rtp
    driver: NV3041A
    width: 480
    height: 272
    rotation: 0         # the glass is landscape
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    spi_hz: 20000000    # the vendor's rate; it notes 60-80 MHz may work once stable
    backlight_active_low: true    # LOW lights it, like the other RTP panels; verified on the bench (0 % was brightest, 100 % dark with it false)
    touch:
      controller: NS2009
      swap_xy: false
      flip_x: false
      flip_y: false
      raw: [150, 3943, 3674, 194]   # measured 2026-10-29 with the RtpCheck 4-point calibration
    notes: >-
      HKC 0430K010-N2T7300, NV3041A-01, from the vendor's TFT43 sketch. The module
      must be strapped for 4-wire SPI 8-bit: IM0 and SPI4W to IOVCC, IM1 to GND, RD up.
      The vendor's rotation numbering has 0 and 2 swapped against the ST7789 family;
      rotations 1-3 have not been looked at on the glass.

  - id: rtp_350
    product: true
    name: '3.5 inch, resistive touch'
    family: rtp
    driver: ST7796
    bus: par8
    width: 320
    height: 480
    rotation: 1         # ships landscape, 480 x 320 (turned right 90 degrees)
    offsets: [0, 0, 0, 0]
    bgr: true           # UNVERIFIED - factory MADCTL 0x48 (BGR | MX); check with RtpCheck
    invert: false       # UNVERIFIED
    backlight_active_low: false
    par8:
      data: [13, 12, 11, 10, 1, 15, 7, 4]   # D0..D7
      wr: 42
      dc: 41
      rd: -1            # RD tied to 3.3 V on the module
      cs: -1            # CS tied to GND on the module
      rst: 2

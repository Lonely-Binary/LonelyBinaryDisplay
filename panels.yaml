    backlight: { mode: pwm, active_low: true }
    init_ops: nv3007_279
    notes: >-
      Same NV3007 silicon as the 1.68 inch but a different voltage/gamma table.
      Without init_ops it would inherit the 1.68 inch settings and look wrong.

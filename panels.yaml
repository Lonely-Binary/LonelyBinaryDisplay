# ─────────────────────────────────────────────────────────────────────────────
# Lonely Binary display panel table — THE single source of truth.
#
# Both language bindings are GENERATED from this file:
#     src/LB_Panels.h        (Arduino / C++)
#     micropython/lb_panels.py
#
# Never hand-edit those two. Run `python3 tools/gen_panels.py` after changing
# this file; CI fails the build if the generated files are stale.
#
# Adding a new panel = adding one entry here. No code changes.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

# ── Wiring ───────────────────────────────────────────────────────────────────
# Every panel in the range uses the same 15-pin FPC and the same breakout, so
# the pins depend only on the MCU, never on the panel. Selected at compile time
# from CONFIG_IDF_TARGET_* (C++) / sys.implementation._machine (MicroPython).
wiring:
  esp32s3:
    cs: 10
    rst: 42
    dc: 2
    mosi: 11
    sclk: 12
    backlight: 41
    miso: -1
    spi_host: HSPI      # Arduino_GFX: SPI3 on the S3
    mp_spi_id: 1        # MicroPython: SPI(1) is the S3's FSPI on these native pins
    psram: true
  esp32:
    cs: 15
    rst: 4
    dc: 2
    mosi: 23
    sclk: 18
    backlight: 32
    miso: -1
    spi_host: VSPI      # Arduino_GFX: NOT FSPI — that is the on-chip flash bus
    mp_spi_id: 2        # MicroPython: SPI(2) is VSPI on its native pins
    psram: false

# ── Panels ───────────────────────────────────────────────────────────────────
# offsets: [col1, row1, col2, row2]
#   Arduino_GFX takes two pairs: pair 1 applies at rotation 0/2, pair 2 at 1/3.
#   The MicroPython driver takes a single xstart/ystart — the generator picks
#   the pair matching the panel's default `rotation`.
#
# bgr / invert / flip_x / flip_y are panel facts. NOTE: st77xx.ST77xx defaults
# to invert=True, and the original per-panel main.py scripts relied on that
# default rather than passing it — so "not mentioned in the old script" means
# true here, not false. Getting this wrong shows as inverted colours.
# Arduino_GFX bakes them into
# its per-driver init sequences, so the C++ side does not pass them; the
# MicroPython driver needs them explicitly. Recorded here either way so the two
# bindings cannot disagree.
#
# backlight.mode: onoff | pwm      backlight.active_low: LOW turns it ON

panels:
  # ── TFT-LCD series (rectangular, portrait) ─────────────────────────────────
  - id: tft_096
    name: '0.96 inch'
    family: tft-lcd
    driver: ST7735
    width: 80
    height: 160
    rotation: 0
    ips: false
    offsets: [24, 0, 24, 0]
    bgr: true
    invert: false
    spi_hz: 20000000
    backlight: { mode: onoff, active_low: true }   # the ONLY tft-lcd panel wired active-low
    notes: >-
      Arduino used gfx->begin() (SPI_DEFAULT_FREQ = 40 MHz on ESP32); MicroPython
      used 20 MHz. Taking the conservative value — verify on hardware.

  - id: tft_18
    name: '1.8 inch'
    family: tft-lcd
    driver: ST7735
    width: 128
    height: 160
    rotation: 0
    ips: true
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    flip_x: true
    flip_y: true
    spi_hz: 20000000
    backlight: { mode: onoff, active_low: false }
    notes: >-
      Arduino used the 40 MHz default; MicroPython used 20 MHz. Conservative
      value taken — verify on hardware.

  - id: tft_20
    name: '2.0 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    ips: true
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight: { mode: onoff, active_low: false }

  - id: tft_24
    name: '2.4 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    ips: true
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight: { mode: onoff, active_low: false }

  - id: tft_28
    name: '2.8 inch'
    family: tft-lcd
    driver: ST7789
    width: 240
    height: 320
    rotation: 0
    ips: true
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true
    spi_hz: 40000000
    backlight: { mode: onoff, active_low: false }

  - id: tft_35
    name: '3.5 inch'
    family: tft-lcd
    driver: ST7796
    width: 320
    height: 480
    rotation: 0
    ips: true
    offsets: [0, 0, 0, 0]
    bgr: true
    invert: true
    spi_hz: 40000000
    backlight: { mode: onoff, active_low: false }

  # ── Narrow LCD series (strip format, landscape, PWM backlight) ─────────────
  - id: narrow_114
    name: '1.14 inch'
    family: narrow-lcd
    driver: ST7789
    width: 135
    height: 240
    rotation: 1
    ips: true
    offsets: [52, 40, 53, 40]
    bgr: false
    invert: true
    spi_hz: 8000000
    backlight: { mode: pwm, active_low: true }
    notes: >-
      Arduino ran 8 MHz, MicroPython 20 MHz. Conservative value taken; if
      8 MHz holds on hardware at 20 MHz, raise it here once for both languages.

  - id: narrow_168
    name: '1.68 inch'
    family: narrow-lcd
    driver: NV3007
    width: 142

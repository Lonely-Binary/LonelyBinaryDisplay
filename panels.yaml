    product: true
    name: '0.96 inch'
    family: tft-lcd
    driver: ST7735
    width: 80
    height: 160
    rotation: 0
    offsets: [24, 0, 24, 0]
    bgr: true
    invert: false
    spi_hz: 20000000
    backlight_active_low: true   # the ONLY tft-lcd panel wired active-low
    notes: >-
      Arduino used gfx->begin() (SPI_DEFAULT_FREQ = 40 MHz on ESP32); MicroPython
      used 20 MHz. Taking the conservative value — verify on hardware.


# ─────────────────────────────────────────────────────────────────────────────
# Lonely Binary display panel table — THE single source of truth.
#
# Both language bindings are GENERATED from this file:
#     src/LB_Panels.h        (Arduino / C++)
#     micropython/lb_panels.py
#
# Never hand-edit those two. Run `python3 tools/gen_panels.py` after changing
# this file; CI fails the build if the generated files are stale.
#
# Adding a new panel = adding one entry here. No code changes.
#
# ─────────────────────────────────────────────────────────────────────────────
# NOTHING IN THIS FILE HAS BEEN MEASURED ON A KIT PANEL YET.
#
# Every value was inferred by reading the old per-panel sketches, and those two
# code paths do not even agree with each other. The clearest example is bgr on
# the ST7735 panels: the Arduino sketches let Arduino_GFX default to BGR, while
# the MicroPython scripts passed bgr=False, i.e. RGB. One of them has been
# wrong the whole time and nobody noticed, because the old test drew UNLABELLED
# colour bars — you cannot tell red from blue in a bar with no caption.
#
# So: verify each panel on a REAL KIT PANEL on the REAL BREAKOUT before
# treating any of this as settled, and annotate what you measured.
#
# Do NOT copy values out of internal/ bench runs. Those sketches deliberately
# drive non-standard panels on non-standard wiring to exercise the manual
# overrides (setColorOrder / setInverted / setBacklightActiveLow); what they
# report is a property of whatever is on the desk that day, not of the product.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
version: 1

# ── Wiring ───────────────────────────────────────────────────────────────────
# Every panel in the range uses the same 15-pin FPC and the same breakout, so
# the pins depend only on the MCU, never on the panel. Selected at compile time
# from CONFIG_IDF_TARGET_* (C++) / sys.implementation._machine (MicroPython).
wiring:
  esp32s3:
    cs: 10
    rst: 42
    dc: 2
    mosi: 11
    sclk: 12
    backlight: 41
    miso: -1
    spi_host: HSPI      # Arduino_GFX: SPI3 on the S3
    mp_spi_id: 1        # MicroPython: SPI(1) is the S3's FSPI on these native pins
    psram: true
  esp32:
    cs: 15
    rst: 4
    dc: 2
    mosi: 23
    sclk: 18
    backlight: 32
    miso: -1
    spi_host: VSPI      # Arduino_GFX: NOT FSPI — that is the on-chip flash bus
    mp_spi_id: 2        # MicroPython: SPI(2) is VSPI on its native pins
    psram: false

# ── Parallel wiring (square series) ──────────────────────────────────────────
# The square panels are 8080 8-bit parallel with an I2C touch controller, on a
# breakout of their own. Same rule as above: the pins depend on the MCU, never
# on the panel.
#
# PROPOSED 2026-09-24 — the breakout is not built yet. Rules behind the choice:
#   * D0-D7, WR and DC all below GPIO 32. The bus writes one set/clear register
#     per byte; pins above 31 live in a second register and cost a second write.
#   * No boot-strapping pins on the data bus. The bench rig had D5 on GPIO12,
#     which picks the flash voltage at reset - moved to 26 here.
#   * Backlight and panel reset keep the roles they have on the SPI breakout
#     (ESP32: BL 32; S3: RST 42, BL 41).
#   * Touch on the MCU's usual I2C pins, so a customer's own I2C sensor can
#     share the bus through Wire.
# CS is tied low and RD tied high on the board: the bus has no other device.
wiring_par8:
  esp32s3:
    data: [4, 5, 6, 7, 15, 16, 17, 18]   # D0..D7, one run of the left header
    wr: 8
    dc: 9
    rst: 42
    backlight: 41
    touch_sda: 1
    touch_scl: 2
    touch_int: 40
    touch_rst: 39
  esp32:
    data: [5, 17, 16, 15, 13, 26, 14, 27]
    wr: 4
    dc: 23
    rst: 33
    backlight: 32
    touch_sda: 21
    touch_scl: 22
    touch_int: 18
    touch_rst: 19

# ── Panels ───────────────────────────────────────────────────────────────────
# product: true  = something Lonely Binary sells. These are the only entries a
#                  customer should ever have to look at; they pick by the size
#                  printed on the box and never see anything else.
# product: false = a panel we do not sell but can drive. Named by CONTROLLER
#                  and resolution rather than by size, so it cannot be mistaken
#                  for a product. This is the same two-namespace split
#                  LovyanGFX and Espressif's ESP32_Display_Panel use: product
#                  or board names on top, controller names underneath.
#
# const: overrides the generated constant name. Use it when the id has to stay
#        precise for device_info while the name in a sketch stays readable.
#
# offsets: [col1, row1, col2, row2]
#   Arduino_GFX takes two pairs: pair 1 applies at rotation 0/2, pair 2 at 1/3.
#   The MicroPython driver takes a single xstart/ystart — the generator picks
#   the pair matching the panel's default `rotation`.
#
# bgr / invert / flip_x / flip_y are panel facts. `invert` is the single
# inversion flag: Arduino_GFX spells the same thing `ips` in its constructors
# (that argument does nothing else), and the MicroPython driver calls it
# `invert`. Carrying both names meant one of them silently did nothing.
# NOTE: st77xx.ST77xx defaults
# to invert=True, and the original per-panel main.py scripts relied on that
# default rather than passing it — so "not mentioned in the old script" means
# true here, not false. Getting this wrong shows as inverted colours.
# Arduino_GFX bakes them into
# its per-driver init sequences, so the C++ side does not pass them; the
# MicroPython driver needs them explicitly. Recorded here either way so the two
# bindings cannot disagree.
#
# backlight_active_low: LOW turns the backlight ON. Every panel in the range
# dims — the library always drives the backlight with LEDC PWM, so
# backlight(0..255) behaves the same on all of them.

panels:
  # ── TFT-LCD series (rectangular, portrait) ─────────────────────────────────
  - id: tft_096
    product: true
    name: '0.96 inch'
    family: tft-lcd
    driver: ST7735
    width: 80
    height: 160
    rotation: 0
    offsets: [24, 0, 24, 0]
    bgr: true
    invert: false
    spi_hz: 20000000
    backlight_active_low: true   # the ONLY tft-lcd panel wired active-low
    notes: >-
      Arduino used gfx->begin() (SPI_DEFAULT_FREQ = 40 MHz on ESP32); MicroPython
      used 20 MHz. Taking the conservative value — verify on hardware.

  - id: tft_18
    product: true
    name: '1.8 inch'
    family: tft-lcd
    driver: ST7735
    width: 128
    height: 160
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false        # UNVERIFIED — see the warning at the top of this file
    invert: true
    flip_x: true
    flip_y: true
    spi_hz: 20000000
    backlight_active_low: false
    notes: >-
      Arduino used the 40 MHz default; MicroPython used 20 MHz. Conservative
      value taken — verify on hardware.

  - id: tft_20
    product: true

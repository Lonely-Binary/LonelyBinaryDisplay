    notes: >-
      F-3501Z4S-E, ST7796, 8080 8-bit parallel, on its own flying-wire pins (not
      the standard breakout). Factory init is in Basic_S3.ino; this library uses
      its generic ST7796 table. GPIO 41/42 (DC/WR) are above 31, which the par8

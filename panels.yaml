  # ── RGB LCD series (16-bit parallel RGB, ESP32-S3 only) ─────────────────────
  #
  # Bare RGB glass on the "IO to RGB" adapter: no controller, the S3's LCD_CAM
  # scans a PSRAM frame buffer out continuously (bus: rgb, as the boards below).
  # All three sizes use the same adapter, so the same pins; only the timings
  # differ. The glass is 24-bit, but the S3 drives 16 lines (R3-R7, G2-G7,
  # B3-B7, RGB565); the low bits are not connected. HSYNC and VSYNC are not
  # wired: the panels run in DE mode. Needs PSRAM (OPI). Named by the diagonal
  # in hundredths of an inch, then the resolution where one size comes in more
  # than one (7 inch glass is sold as 800x480 and 1024x600, 10.1 inch as 1024x600
  # and 1280x800). Every name carries the resolution, so the series reads alike.

  - id: rgb_430_480x272
    product: true
    name: '4.3 inch RGB'
    family: rgb-lcd
    driver: RGB
    bus: rgb
    width: 480
    height: 272
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false   # a 10k pull-down on BL: it must be driven high
    rgb:
      pclk_hz: 9000000            # the datasheet's typical (8-12 MHz)
      # Bounce buffers, not direct_scan: scanned straight out of PSRAM (as on the
      # Sunton 4.3 inch) the picture shook at every photo change, while the JPEG
      # decoder wrote PSRAM. This glass takes its rows from DE, so the start-up
      # shift that made the Sunton board use direct_scan does not apply.
      hsync: {pulse: 4, back: 43, front: 8}
      vsync: {pulse: 4, back: 12, front: 8}
      pclk_active_neg: true
      pins: &io_to_rgb_pins
        de: 42
        vsync: -1                 # not wired: DE mode
        hsync: -1
        pclk: 41
        backlight: 14
        r: [40, 39, 38, 45, 21]       # R3..R7 on the glass = R0..R4 of RGB565
        g: [13, 12, 11, 10, 9, 3]     # G2..G7
        b: [8, 18, 17, 16, 15]        # B3..B7
    notes: >-
      HJ4330PI-7, 480x272, no touch, from the vendor's ESP32S3_RGB_4.3 sketch
      (HJ4330PI7 datasheet typical timings). Same adapter pins as the 7 and 10.1
      inch. Run 2026-11-02: text, edge page and a photo gallery (0.3 s a photo)
      come out right; colours judged only through an overexposed camera.

  - id: rgb_700_1024x600
    product: true
    name: '7 inch RGB'
    family: rgb-lcd
    driver: RGB
    bus: rgb
    width: 1024
    height: 600
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      # The 10 inch's timings (same 50-pin glass family, same datasheet timings).
      # Verified 2026-11-02: the photo gallery runs clean at 40 Hz on the 7 inch
      # glass too. See rgb_1010_1024x600 for why the horizontal blanking is long.
      pclk_hz: 30000000
      hsync: &rgb_1024_hsync {pulse: 10, back: 160, front: 20}
      vsync: &rgb_1024_vsync {pulse: 2, back: 10, front: 5}
      pclk_active_neg: true
      pins: *io_to_rgb_pins
    notes: >-
      HJ7035GI-27-BD, 1024x600, no touch, from the vendor's ESP32S3_RGB_7 sketch.
      In DE mode the panel wants VS and HS pulled high on the adapter. Bare glass:
      AVDD/VGH/VGL/VCOM come from the adapter, with a VCOM trimmer to set per
      panel on a mid-grey screen. DITHB low (dithering off): the S3 sends only
      RGB565, so there is nothing for it to add.

  - id: rgb_1010_1024x600
    product: true
    name: '10.1 inch RGB'
    family: rgb-lcd
    driver: RGB
    bus: rgb
    width: 1024
    height: 600
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      # Measured 2026-11-02 on the 10 inch glass, watched through a camera. The
      # vendor's 16 MHz with the datasheet's blanking (1344 x 635) is 18.4 Hz, and
      # at that rate mid greys shimmer: the glass flips polarity every frame, and
      # turning the VCOM trimmer only shifts the colour. Raising the clock fixes it.
      # The vertical blanking can be short, the HORIZONTAL cannot: with 70 clocks
      # between lines (10/40/20) still pictures look right, but while a JPEG is
      # being decoded the glass loses its row scan and freezes into vertical
      # streaks until the timing changes - at 16 MHz just as at 30. With 190
      # clocks (10/160/20, back porch as the datasheet's 160) it held through
      # every photo of a gallery. 30 MHz over 1214 x 617 = 40 Hz.
      pclk_hz: 30000000
      hsync: *rgb_1024_hsync
      vsync: *rgb_1024_vsync
      pclk_active_neg: true
      pins: *io_to_rgb_pins
    notes: >-
      SH010JGI55-01013L (HX8282-A11 + HX8696), 1024x600, no touch, from the
      vendor's ESP32S3_RGB_10 sketch. Same 50-pin pinout and timings as the 7
      inch. The pin table in the vendor's README is an older wiring; the
      sketch's is the one used here. Bare glass: the adapter makes the bias
      voltages and has a VCOM trimmer, set per panel on a mid-grey screen. DITH
      low (dithering off): only RGB565 is sent, so it has nothing to add, and its
      frame-to-frame dither would add shimmer of its own.

  # ── Third-party boards ─────────────────────────────────────────────────────
  #
  # A display and an ESP32-S3 on one PCB, sold by someone else. Named by the
  # board's own model number, because that is what is printed on it. The pins
  # are fixed by that PCB, so they live here with the panel rather than in a
  # wiring set.
  #
  # bus: rgb - 16-bit parallel RGB (RGB565 on the wires), scanned out
  # continuously by the S3's LCD_CAM from a framebuffer in PSRAM. There is no
  # controller to talk to: the panel is just timings and pins. S3 only.

  - id: sunton_4827s043r
    product: false
    const: LB_SUNTON_4827S043R
    name: 'Sunton ESP32-4827S043R'
    family: board
    driver: RGB
    bus: rgb
    width: 480
    height: 272
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      pclk_hz: 10000000
      # Sunton's own demo: sync polarity 0 (active low), no bounce buffers. The 4.3" panel takes its frame start from the vertical
      # sync, and with the pulse the other way round it locked on to a different line on about four boots in ten.
      sync_idle_high: true
      # One frame buffer scanned straight out of PSRAM: the bounce-buffer scheme (refilled by an interrupt, counted in software) lost
      # a refill at start-up and stayed shifted; two buffers without it alternated and showed two pages on top of each other.
      direct_scan: true
      hsync: {pulse: 4, back: 43, front: 8}
      vsync: {pulse: 4, back: 12, front: 8}
      pclk_active_neg: true
      pins:
        de: 40
        vsync: 41
        hsync: 39
        pclk: 42
        backlight: 2
        r: [45, 48, 47, 21, 14]      # R0..R4 - Sunton's own demo; rzeldent's
        g: [5, 6, 7, 15, 16, 4]      # board files swap R and B
        b: [8, 3, 46, 9, 1]
    touch:
      controller: XPT2046
      pins: {sck: 12, miso: 13, mosi: 11, cs: 38, int: 18}
      raw: [188, 3951, 254, 3791]    # measured 2026-09-24: raw x at left/right edge, y at top/bottom
    notes: >-
      4.3", 480x272, resistive touch. Pins from Sunton's demo (Arduino_GFX
      discussion #587) and rzeldent/platformio-espressif32-sunton, which agree
      except that the latter swaps the R and B names. Timings are rzeldent's.
      Touch shares SPI with the TF card (CS 10).

  - id: sunton_8048s070c
    product: false
    const: LB_SUNTON_8048S070C
    name: 'Sunton ESP32-8048S070C'
    family: board
    driver: RGB
    bus: rgb
    width: 800
    height: 480
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      pclk_hz: 12500000
      hsync: {pulse: 30, back: 16, front: 210}
      vsync: {pulse: 13, back: 10, front: 22}
      pclk_active_neg: true
      pins:
        de: 41
        vsync: 40
        hsync: 39
        pclk: 42
        backlight: 2
        r: [14, 21, 47, 48, 45]      # R0..R4 - Sunton's demo (R/B confirmed on the 4827S043R)
        g: [9, 46, 3, 8, 16, 1]
        b: [15, 7, 6, 5, 4]
    touch:
      controller: GT911
      # INT deliberately not used: GPIO18 is also the MAX98357's I2S LRCLK and
      # is on header P4. Driving it low for the GT911 address strap would poke
      # the amplifier. The driver polls and tries both addresses without it.
      pins: {sda: 19, scl: 20, int: -1, rst: 38}
    notes: >-
      7", 800x480, capacitive touch. Pins from Sunton's demo; timings from
      rzeldent/platformio-espressif32-sunton. Also on the board: MAX98357 I2S
      amplifier (DIN 17, LRCLK 18), microSD on SPI (CS 10, MOSI 11, SCK 12,
      MISO 13), headers P1 (UART0 43/44) and P4 (17, 18).
      The 750 KB framebuffer is scanned out of PSRAM at 25 MB/s.

  - id: vga_16bit
    product: true
    const: LB_VGA_16BIT
    name: 'Lonely Binary ESP32-S3 VGA 16-bit'
    family: board
    driver: RGB
    bus: rgb
    # width / height are the DEFAULT resolution (what begin() gives without setResolution()). The board itself is not tied to
    # one resolution: the 16-bit (5-6-5) resistor ladder takes whatever timing the S3 sends, and `modes` below lists the others.
    # This entry was LB_VGA_800X600 until 0.2.0; that name is kept as a deprecated alias with the same default.
    width: 800
    height: 600
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      # 32 MHz over 1024 x 626 total pixels = 800x600 @ 49.9 Hz, positive sync. The standard VESA 800x600 @ 56 Hz is 36 MHz and was
      # tried first, but it leaves no margin: the bounce buffers (10 lines, 16000 bytes) are refilled from PSRAM by a CPU copy that
      # must finish in 10 line times. Measured with the picture running: a cold copy takes 250-300 us and the budget at 36 MHz is
      # 284 us (320 us at 32 MHz), so whether a line makes it depends on what the data cache holds - short streaks at the left of
      # some lines, and a one-line change in a sketch could switch them on or off. At 32 MHz the same code is clean.
      # (VESA 800x600 @ 60 is 40 MHz and needs 80 MB/s; the PSRAM manages about 60.) A sketch must still not do big PSRAM reads or
      # writes while it runs, and the Wi-Fi radio on makes the picture shake. Two frame buffers and ten-line bounce buffers (600 / 10 = 60).
      # 626 lines, not 625 (2026-11-05): 1024 x 625 at 32 MHz is exactly 20.000 ms, twenty 1 ms FreeRTOS ticks, so the tick
      # interrupt falls on the same bounce-buffer refill every frame, at a place fixed at power-up. On the HDMI board, with the same
      # timing, that gave static streaks at the left on about 6 boots in 10; with 626 lines (20.032 ms, 49.9 Hz) 1 in 10.
      pclk_hz: 32000000
      # Positive-going sync pulses, as VESA 800x600 asks (idle low).
      hsync: {pulse: 72, back: 128, front: 24}
      vsync: {pulse: 2, back: 22, front: 2}
      pclk_active_neg: false
      # Other resolutions, for display.setResolution(w, h). The default above is always the first one.
      modes:
        # VESA 640x480 @ 60, negative sync. Timing from Lonely Binary VGA 2.0 on this same board (25.0 MHz is -0.7 % from
        # 25.175, inside VGA tolerance; measured 59.5 Hz there). Not yet re-measured through this library.
        - {width: 640, height: 480, pclk_hz: 25000000, hsync: {pulse: 96, back: 48, front: 16}, vsync: {pulse: 2, back: 33, front: 10}, sync_idle_high: true}
      pins:
        # A VGA monitor has no data-enable and takes no pixel clock: both are -1, which esp_lcd runs as HV mode, the sync pulses alone
        # framing the picture. The 16 data lines are a resistor ladder (5-6-5) into the DE-15 connector.
        de: -1
        vsync: 1
        hsync: 2
        pclk: -1
        backlight: -1
        r: [7, 15, 16, 38, 39]      # R0..R4
        g: [17, 18, 8, 3, 9, 10]    # G0..G5
        b: [11, 12, 13, 14, 21]     # B0..B4
    notes: >-
      VGA out of an ESP32-S3 N16R8 through a 16-bit (5-6-5) R2R ladder, default 800x600 at 50 Hz, 640x480 at 60 Hz with
      setResolution(640, 480). No touch. Drawing into the screen manages 2 to 5 million pixels a second (a full-screen fill takes about
      0.23 s), because the scan-out takes most of the PSRAM bandwidth. BOOT (GPIO0) is the only button; UART0 is GPIO43/44. Pins and
      timings are the ones that ran in the VGA_PhotoGallery sketch.

  - id: hdmi_rgb
    product: true
    const: LB_HDMI_RGB
    name: 'Lonely Binary ESP32-S3 RGB to HDMI'
    family: board
    driver: RGB
    bus: rgb
    # Default resolution; setResolution() picks another from `modes`.
    width: 800
    height: 600
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      # The S3 sends RGB565 with a pixel clock and DE to a SiI9022A HDMI transmitter (U1), which is set up over I2C (TPI) by
      # begin(): see LB_HdmiSii9022.cpp. Board: "ESP32-S3 RGB转HDMI V2" (schematic and netlist 2026-11-04).
      # Default 800x600 @ 50: the VGA board's timing, 32 MHz from PLL160 / 5 (an integer divide, so no clock jitter). Chosen as the
      # default on 2026-11-05 after every mode below showed on the monitor; setResolution(640, 480) is the one for a fussy monitor.
      # 626 lines, not 625: with 625 a frame is exactly 20.000 ms, twenty of the 1 ms FreeRTOS ticks, so the tick interrupt lands on
      # the same bounce-buffer refill every frame, fixed at power-up; on about 6 boots in 10 that refill was late every frame and
      # the picture had streaks at the left until the next boot. 626 lines (20.032 ms) lets the tick drift: 1 boot in 10 then.
      pclk_hz: 32000000
      hsync: {pulse: 72, back: 128, front: 24}
      vsync: {pulse: 2, back: 22, front: 2}
      clk_src: pll160
      pclk_active_neg: false     # the S3 changes data on the rising edge, the SiI9022A latches on the rising edge (TPI 0x08 = 0x70)
      # Every resolution below was run on the board on 2026-11-04 (two RGB565 frame buffers in PSRAM, ten- or twelve-line bounce
      # buffers, a box being redrawn while it scans out): 0 late frames in each, the monitor connected throughout. The first five are
      # standard or near-standard and taken by nearly everything. The last four get their size by giving up refresh rate (the pixel
      # clock stays at 32 MHz - past about 36 MHz the scan-out cannot keep up): 27 to 35 Hz, which some monitors refuse ("no signal").
      # Each line keeps at least 128 pixels of blanking, because the HDMI audio packets travel in the horizontal blank (80 pixels
      # gave noise on the board, 128 and up were clean). See docs/HDMI_RGB.md.
      modes:
        # 640x480 with the clock the board has always run at: 27.178 MHz from the default clock source (64.7 Hz by the numbers;
        # VESA wants 25.175), negative sync. The SiI9022A is told the timing is non-standard (VIC 0). The safest on old monitors.
        - {width: 640, height: 480, pclk_hz: 27178000, hsync: {pulse: 96, back: 48, front: 16}, vsync: {pulse: 2, back: 33, front: 10}, sync_idle_high: true}
        - {width: 720, height: 480, pclk_hz: 27000000, hsync: {pulse: 62, back: 60, front: 16}, vsync: {pulse: 6, back: 30, front: 9}, sync_idle_high: true}
        # 576p has one line more than CEA's 625 for the same reason as the default: 864 x 625 at 27 MHz is exactly 20.000 ms.
        - {width: 720, height: 576, pclk_hz: 27000000, hsync: {pulse: 64, back: 68, front: 12}, vsync: {pulse: 5, back: 39, front: 6}, sync_idle_high: true}
        # setResolution(800, 600) is the default above; setResolution(800, 600, 56) the VESA 56 Hz at 36 MHz.
        - {width: 800, height: 600, pclk_hz: 36000000, hsync: {pulse: 72, back: 128, front: 24}, vsync: {pulse: 2, back: 22, front: 1}}
        # Higher resolutions, low refresh rates: some monitors refuse them.
        - {width: 1024, height: 768, pclk_hz: 32000000, hsync: {pulse: 32, back: 80, front: 48}, vsync: {pulse: 3, back: 10, front: 1}, clk_src: pll160}
        - {width: 1280, height: 720, pclk_hz: 32000000, hsync: {pulse: 32, back: 64, front: 48}, vsync: {pulse: 5, back: 20, front: 5}, clk_src: pll160}
        - {width: 1366, height: 768, pclk_hz: 32000000, hsync: {pulse: 32, back: 56, front: 40}, vsync: {pulse: 5, back: 14, front: 3}, clk_src: pll160}
        - {width: 1280, height: 800, pclk_hz: 32000000, hsync: {pulse: 32, back: 64, front: 48}, vsync: {pulse: 6, back: 19, front: 3}, clk_src: pll160}
      hdmi_tx: sii9022           # U1, TPI over I2C
      i2c: {sda: 5, scl: 4, addr: 0x3B}   # CI2CA pulled high by R9: TPI address 0x3B, not the default 0x39
      i2s: {bclk: 42, ws: 41, dout: 40}   # into the SiI9022A's SCK / WS / SD0: HDMI sound. MCLK is not wired and not needed.
      pins:
        de: 45
        vsync: 39
        hsync: 38
        pclk: 12
        backlight: -1
        # Only the top bits of each colour reach the SiI9022A (D23-19, D15-10, D7-3); the rest of its 24 inputs float.
        r: [18, 17, 16, 15, 6]      # R0..R4 -> D19..D23
        g: [11, 10, 9, 46, 3, 8]    # G0..G5 -> D10..D15
        b: [48, 47, 21, 14, 13]     # B0..B4 -> D3..D7
    notes: >-
      HDMI out of an ESP32-S3 N16R8 through a SiI9022A transmitter: picture and sound. Default 800x600 @ 50; setResolution() also takes
      640x480, 720x480, 720x576, 800x600 @ 56, and - at 27 to 35 Hz, which some monitors refuse - 1024x768, 1280x720, 1366x768 and
      1280x800. RESET of the SiI9022A is tied to the board's RST button, not to a GPIO, so ESP.restart() does
      not reset it; begin() always sets it up from scratch. Unplugging and re-plugging the HDMI cable is handled in the background
      (the chip is set up again within about a second). I2C on GPIO4/5 is the library's: a sketch that uses Wire must use the same
      pins. Serial is the native USB port: Tools > USB CDC On Boot > Enabled.

  - id: hdmi_vga
    product: true
    const: LB_HDMI_VGA
    name: 'Lonely Binary ESP32-S3 VGA to HDMI'
    family: board
    driver: RGB
    bus: rgb
    width: 720
    height: 576
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: false
    backlight_active_low: false
    rgb:
      # The S3 drives two R-2R ladders and HSYNC/VSYNC like a VGA board, and an MS9288C digitises that analogue VGA and sends HDMI.
      # No pixel clock or DE reaches it: the MS9288C rebuilds its sampling clock from HSYNC, so the pixel clock must be an INTEGER
      # divide of PLL160 / PLL240 - a fractional divider's jitter shows as ragged vertical edges. The MS9288C runs in its internal-MCU
      # mode and needs no setup. Board: ESP32S3-HDMI-Shield v1 / Debug-T1 (ai-pcb). Timings from its hdmi_resolution_test firmware:
      # 720x576@49, 720x480@59 and 640x480@57 are clean there; 800x600@60 (40 MHz) shakes, and above that fails.
      # NOT YET RUN THROUGH THIS LIBRARY.
      pclk_hz: 26666667          # PLL160 / 6; standard 576p is 27 MHz (-1.2 %), 49.4 Hz
      hsync: {pulse: 64, back: 68, front: 12}
      vsync: {pulse: 5, back: 39, front: 5}
      pclk_active_neg: false
      sync_idle_high: true       # negative sync, as 576p
      clk_src: pll160
      modes:
        - {width: 720, height: 480, pclk_hz: 26666667, hsync: {pulse: 62, back: 60, front: 16}, vsync: {pulse: 6, back: 30, front: 9}, sync_idle_high: true, clk_src: pll160}
        - {width: 640, height: 480, pclk_hz: 24000000, hsync: {pulse: 96, back: 48, front: 16}, vsync: {pulse: 2, back: 33, front: 10}, sync_idle_high: true, clk_src: pll240}
      pins:
        de: -1
        vsync: 5
        hsync: 4
        pclk: -1
        backlight: -1
        r: [38, 39, 40, 41, 42]     # R0..R4
        g: [10, 9, 46, 3, 8, 18]    # G0..G5
        b: [17, 16, 15, 7, 6]       # B0..B4
    notes: >-
      HDMI out of an ESP32-S3 N16R8 through an MS9288C VGA-to-HDMI converter. Default 720x576 at 49.4 Hz; setResolution() also
      takes 720x480 and 640x480. Picture only for now: the board's audio path is not supported by the library yet.
      Not yet verified with this library.

  # ── Panels we do NOT sell ──────────────────────────────────────────────────
  #
  # Driveable, but not products. Keyed by controller + resolution so nobody
  # shopping for "the 2.8 inch" can land here by mistake — the 2.8 inch we sell
  # is tft_28, an ST7789, and it is in the list above.

  - id: ili9341_240x320
    product: false
    const: LB_ILI9341_240X320
    name: 'ILI9341 240x320'
    family: generic
    driver: ILI9341
    width: 240          # verified 2026-08-30
    height: 320         # verified 2026-08-30
    rotation: 0
    offsets: [0, 0, 0, 0]   # verified: all four edges land on the glass
    bgr: true           # verified 2026-08-30
    invert: false       # verified 2026-08-30
    spi_hz: 40000000
    backlight_active_low: false   # verified 2026-08-30
    notes: >-
      Measured on one panel, 2026-08-30, on the classic-ESP32 bench rig. Every
      value that was a guess turned out right: colour BGR and not inverted
      (combo 1 of 4 was the correct card), rotation 0 upright at the stated
      size, all four edge bars visible so the glass really is the full 240x320
      of controller RAM and needs no offsets, and the backlight is active high.
      40 MHz was later exercised for minutes under a full LVGL dashboard
      (arc, scrolling chart, two bars, all redrawing four times a second)
      through partial rendering, with no tearing — so the clock is good.
      STILL UNVERIFIED: only rotation 0 has been checked. 1, 2 and 3 are
      untried, and ILI9341 is the one controller here with its own MADCTL
      rotation mapping, so those are the interesting ones.

  # ── ILI9327 400x240, 8-bit parallel, no touch ─────────────────────────────
  #
  # par8: the pins, when the module is NOT on the square-series breakout. Unlike
  # wiring_par8 these belong to the panel entry, because a loose 8080 module has
  # no breakout to inherit from. cs / rd are real pins here (-1 = tied off).
  # A sketch can still override all of it with setWiring().
  - id: ili9327_400x240
    product: false
    const: LB_ILI9327_400X240
    name: 'ILI9327 400x240'
    family: generic
    driver: ILI9327
    bus: par8
    width: 240          # controller RAM is 240 x 432; the glass shows 400 rows
    height: 400
    rotation: 1         # ships landscape, 400 x 240; verified 2026-10-07 (upright, full screen)
    # MCUFRIEND_kbv's OFFSET_9327: the glass is the first 400 of 432 RAM rows,
    # so the two rotations that flip the row scan start 32 rows in.
    offsets: [0, 0, 0, 32]
    bgr: true           # verified 2026-10-07 by eye
    invert: false       # verified 2026-10-07 by eye
    backlight_active_low: false   # verified 2026-10-07
    par8:
      data: [14, 12, 13, 15, 2, 4, 16, 17]   # D0..D7
      wr: 33
      dc: 27
      rd: 5
      cs: 26
      rst: 18
      backlight: 32
    notes: >-
      Third-party 400x240 module on a classic ESP32. Init table is MCUFRIEND_kbv's
      (there is no Arduino_GFX driver to capture from), see LB_TFTInitExtra.h.
      GPIO 12 (D1) and 15 (D3) are boot-strapping pins and 2 (D4) / 5 (RD) are
      too: if the board will not boot with the module plugged in, unplug it.

  # ── ILI9486 320x480, SPI, resistive touch on the same SPI bus ───────────────
  #
  # spi: this module's own pins, for the same reason as par8 above. Touch
  # shares MOSI/MISO/SCLK with the display and has its own CS and IRQ.
  # The host (VSPI/HSPI) is not here: it follows the MCU, from LB_WIRING.
  - id: ili9486_480x320
    product: false
    const: LB_ILI9486_480X320
    name: 'ILI9486 480x320'
    family: generic
    driver: ILI9486
    width: 320
    height: 480
    rotation: 3         # verified 2026-10-07: 480x320 landscape, upright, full screen
    offsets: [0, 0, 0, 0]
    bgr: true           # verified 2026-10-07 by eye: red/green/blue blocks correct
    invert: false       # verified 2026-10-07
    spi_hz: 20000000    # UNVERIFIED - conservative; the chip takes 18-bit colour over SPI
    backlight_active_low: false
    spi:
      cs: 16
      rst: -1           # software reset
      dc: 0
      mosi: 23
      miso: 19
      sclk: 18
      backlight: 2
      touch_cs: 15
      touch_irq: 4
    # No touch: the XPT2046 on this module (CS 15, IRQ 4, shared bus) never
    # answered - MISO read all ones even bit-banged, so it is wiring, not code.
    # touch_cs / touch_irq above stay so the pins are recorded.
    notes: >-
      Third-party 3.5" module on a classic ESP32. Native 320x480; it ships landscape (rotation 3). ILI9486 over SPI takes 18-bit
      colour only, so the bus expands RGB565 to three bytes a pixel (COLMOD
      0x66). Init is Arduino_ILI9486_18bit's. GPIO 0 (DC), 2 (BL) and 15
      (touch CS) are boot-strapping pins.

  # Same panel as ili9341_240x320, shipped landscape. The constant a sketch
  # picks for a screen that is mounted sideways; everything else is identical.
  - id: ili9341_320x240
    product: false
    const: LB_ILI9341_320X240
    name: 'ILI9341 320x240'
    family: generic
    driver: ILI9341
    width: 240
    height: 320
    rotation: 1         # verified 2026-10-07: upright, colours and edges correct
    offsets: [0, 0, 0, 0]
    bgr: true
    invert: false
    spi_hz: 40000000
    backlight_active_low: false
    notes: ili9341_240x320 turned 90 degrees; native size and every other value are the same.

  # ── ST7305 400x300 reflective monochrome LCD, SPI ───────────────────────────
  #
  # Not e-paper: a frame is a few milliseconds, nothing ghosts, there is no BUSY
  # pin and no backlight (the driver ignores the breakout's backlight pin). It
  # is 1 bit per pixel; the sketch still draws in colour and flush() thresholds
  # to black and white. Needs PSRAM for the 240 KB canvas.
  # Pins are the standard breakout (S3: CS 10, DC 2, MOSI 11, SCLK 12, RST 42).
  - id: st7305_400x300
    product: false
    const: LB_ST7305_400X300
    name: 'ST7305 400x300 RLCD'
    family: generic
    driver: ST7305
    width: 400
    height: 300
    rotation: 0
    offsets: [0, 0, 0, 0]
    bgr: false
    invert: true        # verified 2026-10-21: INVON gives black ink on a white page
    spi_hz: 10000000    # UNVERIFIED - conservative, a frame is 15 KB (~12 ms)
    backlight_active_low: false
    notes: >-
      Third-party 4.2" reflective LCD (Waveshare ESP32-S3-RLCD-4.2 uses it). Init values and the
      2x4-block pixel layout come from Waveshare's reference driver; nothing here has been run
      on a Lonely Binary bench yet. Rotation 0 and 2 only while a canvas exists (always, here).

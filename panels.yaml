  # ── Panels we do NOT sell ──────────────────────────────────────────────────
  #
  # Driveable, but not products. Keyed by controller + resolution so nobody
  # shopping for "the 2.8 inch" can land here by mistake — the 2.8 inch we sell
  # is tft_28, an ST7789, and it is in the list above.

  - id: ili9341_240x320
    product: false
    const: LB_ILI9341_240X320
    name: 'ILI9341 240x320'
    family: generic
    driver: ILI9341
    width: 240          # verified 2026-08-30
    height: 320         # verified 2026-08-30
    rotation: 0
    offsets: [0, 0, 0, 0]   # verified: all four edges land on the glass
    bgr: true           # verified 2026-08-30
    invert: false       # verified 2026-08-30
    spi_hz: 40000000
    backlight_active_low: false   # verified 2026-08-30
    notes: >-
      Measured on one panel, 2026-08-30, on the classic-ESP32 bench rig. Every
      value that was a guess turned out right: colour BGR and not inverted
      (combo 1 of 4 was the correct card), rotation 0 upright at the stated
      size, all four edge bars visible so the glass really is the full 240x320
      of controller RAM and needs no offsets, and the backlight is active high.
      40 MHz was later exercised for minutes under a full LVGL dashboard
      (arc, scrolling chart, two bars, all redrawing four times a second)
      through partial rendering, with no tearing — so the clock is good.
      STILL UNVERIFIED: only rotation 0 has been checked. 1, 2 and 3 are
      untried, and ILI9341 is the one controller here with its own MADCTL
      rotation mapping, so those are the interesting ones.

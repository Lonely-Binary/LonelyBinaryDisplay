sentence=One-line setup for every Lonely Binary SPI display — change one constant to swap panels.
paragraph=All Lonely Binary display modules share a 15-pin FPC and one breakout, so swapping a panel is a hardware no-op. This library makes it a software no-op too: LB_Display display(LB_TFT_24) resolves the driver IC, resolution, inversion, column/row offsets, SPI clock and backlight polarity from a built-in panel table, and picks the right GPIOs for the ESP32-S3 or classic ESP32 you selected. Backlight dimming, rotation-aware offsets and a framebuffer are handled for you, by the library's own panel driver. Brought to you by Lonely Binary — this library exists because of the wonderful customers who buy our products and keep supporting our open-source work. Thank you!
category=Display
url=https://github.com/Lonely-Binary/LonelyBinaryDisplay
architectures=esp32
depends=Lonely Binary GFX
includes=LonelyBinaryDisplay.h

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # panels.yaml is the single source of truth. If someone edits a generated
  # file by hand, or edits panels.yaml and forgets to regenerate, the two
  # language bindings drift apart silently. This job is what stops that.
  panel-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Generated tables match panels.yaml
        run: python3 tools/gen_panels.py --check

  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GFX Library for Arduino"
      - name: Build every example on both MCUs
        run: |
          set -e
          for fqbn in esp32:esp32:esp32s3 esp32:esp32:esp32; do
            for ex in examples/*/; do
              echo "== $fqbn $ex"
              arduino-cli compile --fqbn "$fqbn" --library . "$ex"
            done
          done

      # Every panel constant must compile on both MCUs. This is the cheap
      # version of the hardware sweep and catches a bad panels.yaml entry.
      - name: Compile every panel on both boards
        run: |
          set -e
          mkdir -p /tmp/PanelSweep
          for fqbn in esp32:esp32:esp32s3 esp32:esp32:esp32; do
            for p in LB_TFT_096 LB_TFT_18 LB_TFT_20 LB_TFT_24 LB_TFT_28 LB_TFT_35 \
                     LB_NARROW_114 LB_NARROW_168 LB_NARROW_19 LB_NARROW_225 LB_NARROW_279; do
              sed "s/LB_TFT_24/$p/" examples/SelfTest/SelfTest.ino > /tmp/PanelSweep/PanelSweep.ino
              echo "== $fqbn $p"
              arduino-cli compile --fqbn "$fqbn" --library . /tmp/PanelSweep
            done
          done

  micropython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax-check the MicroPython sources
        run: python3 -m compileall -q micropython
      - name: package.json is valid and lists every module
        run: |
          python3 - <<'PY'
          import json, pathlib
          pkg = json.load(open("micropython/package.json"))
          listed = {u[0] for u in pkg["urls"]}
          on_disk = {p.name for p in pathlib.Path("micropython").glob("*.py")}
          missing = on_disk - listed
          assert not missing, f"not listed in package.json: {sorted(missing)}"
          print(f"{len(listed)} modules listed")
          PY
